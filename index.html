<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贈品庫存表 - 雲端即時同步版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        chai: {
                            50: '#FDFBF7',
                            100: '#F7F2EC',
                            200: '#EDE4D8',
                            300: '#DFD1BF',
                            400: '#C7B299',
                            500: '#AD9375',
                            600: '#92795B',
                            700: '#756046',
                            800: '#5C4A35',
                            900: '#433627',
                            dark: '#2D231B'
                        },
                        cream: {
                            50: '#FFFDF9',
                            100: '#FAF6ED',
                            200: '#F4EFE1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #F7F2EC; }
        ::-webkit-scrollbar-thumb { background: #DFD1BF; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #C7B299; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-full bg-chai-50 text-chai-800 font-sans antialiased flex flex-col selection:bg-chai-300 selection:text-chai-900">

    <div id="app" class="flex-1 flex flex-col max-w-5xl mx-auto w-full p-4 sm:p-8 overflow-hidden">
        <!-- Top Header & Summary -->
        <header class="bg-cream-50/90 backdrop-blur-md border border-chai-200/80 rounded-3xl p-6 shadow-sm mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-chai-500 to-chai-700 flex items-center justify-center text-white shadow-md shadow-chai-900/20">
                    <i class="fa-solid fa-gift text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-chai-900 tracking-tight">贈品庫存表</h1>
                    <p class="text-xs text-chai-500 font-medium flex items-center gap-2">
                        <span>多圖上傳 · 雲端即時同步</span>
                        <span id="sync-status" class="inline-flex items-center gap-1 text-[11px] text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full"><i class="fa-solid fa-rotate fa-spin"></i> 連線雲端中...</span>
                    </p>
                </div>
            </div>

            <div class="flex items-center space-x-4 w-full sm:w-auto justify-end">
                <div class="bg-chai-100/80 px-4 py-2 rounded-2xl border border-chai-200 text-right">
                    <span class="text-[11px] font-bold text-chai-500 block uppercase">贈品總數量</span>
                    <span id="header-total-qty" class="text-lg font-bold text-chai-900 font-mono">0</span>
                </div>
                <button onclick="openModal('add')" class="inline-flex items-center space-x-2 bg-gradient-to-r from-chai-600 to-chai-700 hover:from-chai-700 hover:to-chai-800 text-cream-50 px-5 py-3 rounded-2xl text-sm font-semibold shadow-md shadow-chai-700/20 transition-all active:scale-95 shrink-0">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>新增贈品</span>
                </button>
            </div>
        </header>

        <!-- Main Items Grid Area -->
        <main class="flex-1 overflow-y-auto pr-1">
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            <div id="empty-state" class="hidden py-24 text-center">
                <div class="h-20 w-20 bg-chai-100 text-chai-400 rounded-3xl flex items-center justify-center mx-auto text-3xl mb-4 shadow-inner">
                    <i class="fa-solid fa-gifts"></i>
                </div>
                <h3 class="text-chai-800 font-bold text-lg">目前尚無贈品項目</h3>
                <p class="text-chai-400 text-xs mt-1">點擊右上角「新增贈品」開始建立您的贈品清單</p>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="item-modal" class="fixed inset-0 bg-chai-dark/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden animate-fade-in">
        <div class="bg-cream-50 rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-chai-200 max-h-[90vh] flex flex-col">
            <div class="px-6 py-5 border-b border-chai-200/80 flex items-center justify-between bg-cream-100/70 shrink-0">
                <h3 id="modal-title" class="font-bold text-chai-900 text-lg">新增贈品項目</h3>
                <button onclick="closeModal()" class="h-8 w-8 rounded-full bg-chai-200/70 hover:bg-chai-300 flex items-center justify-center text-chai-700 transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="item-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4.5 overflow-y-auto flex-1">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-bold text-chai-700 uppercase tracking-wider mb-1.5">贈品名稱 *</label>
                    <input type="text" id="form-name" required placeholder="例如：品牌精美帆布袋" class="w-full px-4 py-2.5 bg-cream-100/60 border border-chai-300 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-chai-500/30 focus:border-chai-600 transition-all text-chai-900 font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-chai-700 uppercase tracking-wider mb-1.5">數量 *</label>
                    <input type="number" id="form-qty" required min="0" value="10" class="w-full px-4 py-2.5 bg-cream-100/60 border border-chai-300 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-chai-500/30 focus:border-chai-600 transition-all text-chai-900 font-medium font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-chai-700 uppercase tracking-wider mb-1.5">上傳多張圖片 (可選多張)</label>
                    <div class="space-y-3">
                        <input type="file" id="form-files" accept="image/*" multiple onchange="handleMultipleImagesUpload(event)" class="w-full text-xs text-chai-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-chai-200 file:text-chai-700 hover:file:bg-chai-300 cursor-pointer">
                        <div id="images-preview-grid" class="grid grid-cols-3 gap-2.5 pt-1"></div>
                    </div>
                </div>
                <div class="pt-4 flex items-center justify-end space-x-3.5 border-t border-chai-200 shrink-0">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-2xl border border-chai-300 text-sm font-semibold text-chai-700 hover:bg-chai-100 transition-all">取消</button>
                    <button type="submit" class="px-5.5 py-2.5 rounded-2xl bg-gradient-to-r from-chai-600 to-chai-700 hover:from-chai-700 hover:to-chai-800 text-cream-50 text-sm font-semibold shadow-md shadow-chai-700/20 transition-all">儲存贈品</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gift-inventory-realtime-v1';
        
        // ==========================================================
        // 請將下方 firebaseConfig 替換為您從 Firebase 控制台取得的真實數值
        // ==========================================================
        const firebaseConfig = {
  apiKey: "AIzaSyBBZMSZv8a8mHMp9YuTfjGhyVT_tlN-usE",
  authDomain: "instock-80b3a.firebaseapp.com",
  projectId: "instock-80b3a",
  storageBucket: "instock-80b3a.firebasestorage.app",
  messagingSenderId: "445130320238",
  appId: "1:445130320238:web:64ec35de720eba8abaf97f",
  measurementId: "G-NQ0S6CH4MF"
};
        let db, auth;
        let inventory = [];
        let currentUploadedImages = [];
        window.currentUploadedImages = currentUploadedImages;

        async function initCloud() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'gift_items_v2');

                // 即時監聽雲端資料變動
                onSnapshot(colRef, (snapshot) => {
                    inventory = [];
                    snapshot.forEach(docSnap => {
                        inventory.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    renderInventory();
                    document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-cloud text-emerald-600"></i> 雲端即時同步已連線';
                    document.getElementById('sync-status').className = 'inline-flex items-center gap-1 text-[11px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full';
                }, (error) => {
                    console.warn("Cloud sync error:", error);
                    enableLocalStorageMode();
                });

            } catch (err) {
                console.warn("Firebase init failed, using local mode:", err);
                enableLocalStorageMode();
            }
        }

        function enableLocalStorageMode() {
            document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-database text-amber-600"></i> 本地模式 (請檢查Firebase設定)';
            document.getElementById('sync-status').className = 'inline-flex items-center gap-1 text-[11px] text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full';
            inventory = JSON.parse(localStorage.getItem('gift_inventory_local_v2')) || [];
            renderInventory();
        }

        window.saveItem = async function(item) {
            try {
                if (db && auth && auth.currentUser) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'gift_items_v2', item.id);
                    await setDoc(docRef, item);
                } else {
                    throw new Error("No cloud DB");
                }
            } catch (e) {
                const idx = inventory.findIndex(i => i.id === item.id);
                if (idx >= 0) inventory[idx] = item;
                else inventory.unshift(item);
                localStorage.setItem('gift_inventory_local_v2', JSON.stringify(inventory));
                renderInventory();
            }
        };

        window.deleteItemCloud = async function(id) {
            try {
                if (db && auth && auth.currentUser) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'gift_items_v2', id);
                    await deleteDoc(docRef);
                } else {
                    throw new Error("No cloud DB");
                }
            } catch (e) {
                inventory = inventory.filter(i => i.id !== id);
                localStorage.setItem('gift_inventory_local_v2', JSON.stringify(inventory));
                renderInventory();
            }
        };

        window.getInventory = () => inventory;
        window.initCloud = initCloud;
    </script>

    <script>
        function renderInventory() {
            const inventory = window.getInventory ? window.getInventory() : [];
            const grid = document.getElementById('items-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (inventory.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                inventory.forEach(item => {
                    const fallbackImg = `https://placehold.co/300x200/DFD1BF/756046?text=Gift`;
                    const images = (item.images && item.images.length > 0) ? item.images : [fallbackImg];
                    const mainImg = images[0];

                    const card = document.createElement('div');
                    card.className = "bg-cream-50 rounded-3xl border border-chai-200/80 shadow-sm hover:shadow-md transition-all overflow-hidden flex flex-col group animate-fade-in";
                    
                    let imgHtml = `
                        <div class="h-48 w-full bg-chai-100 overflow-hidden relative border-b border-chai-200/60 group/img">
                            <img id="img-display-${item.id}" src="${mainImg}" onerror="this.src='${fallbackImg}'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="">
                            <div class="absolute top-3 right-3 flex items-center space-x-1 bg-cream-50/90 backdrop-blur-md p-1 rounded-xl border border-chai-200 shadow-sm z-10">
                                <button onclick="openModal('edit', '${item.id}')" title="編輯" class="h-7 w-7 rounded-lg hover:bg-chai-200 text-chai-700 flex items-center justify-center transition-all text-xs"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteItem('${item.id}')" title="刪除" class="h-7 w-7 rounded-lg hover:bg-rose-100 text-chai-700 hover:text-rose-700 flex items-center justify-center transition-all text-xs"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                    `;

                    if (images.length > 1) {
                        imgHtml += `<div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center space-x-1.5 bg-chai-dark/50 backdrop-blur-sm px-2.5 py-1 rounded-full z-10">`;
                        images.forEach((_, idx) => {
                            imgHtml += `<button onclick="switchCardImage('${item.id}', ${idx})" class="w-2 h-2 rounded-full ${idx === 0 ? 'bg-amber-400' : 'bg-white/60 hover:bg-white'} transition-all" id="dot-${item.id}-${idx}"></button>`;
                        });
                        imgHtml += `</div>`;
                    }
                    imgHtml += `</div>`;

                    card.innerHTML = `
                        ${imgHtml}
                        <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                            <h3 class="font-bold text-chai-900 text-base tracking-tight">${escapeHtml(item.name)}</h3>
                            <div class="flex items-center justify-between bg-chai-100/60 px-4 py-3 rounded-2xl border border-chai-200/60">
                                <span class="text-xs font-bold text-chai-600 uppercase">即時數量</span>
                                <div class="flex items-center space-x-3">
                                    <button onclick="adjustQty('${item.id}', -1)" class="h-8 w-8 rounded-xl bg-cream-50 hover:bg-chai-200 text-chai-800 flex items-center justify-center transition-all shadow-sm"><i class="fa-solid fa-minus text-xs"></i></button>
                                    <span class="font-bold font-mono text-lg text-chai-900 w-8 text-center">${item.qty}</span>
                                    <button onclick="adjustQty('${item.id}', 1)" class="h-8 w-8 rounded-xl bg-cream-50 hover:bg-chai-200 text-chai-800 flex items-center justify-center transition-all shadow-sm"><i class="fa-solid fa-plus text-xs"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            const inventoryList = window.getInventory ? window.getInventory() : [];
            const totalQty = inventoryList.reduce((acc, curr) => acc + Number(curr.qty), 0);
            document.getElementById('header-total-qty').innerText = totalQty.toLocaleString();
        }

        function switchCardImage(itemId, imgIdx) {
            const inventory = window.getInventory ? window.getInventory() : [];
            const item = inventory.find(i => i.id === itemId);
            if (!item || !item.images || !item.images[imgIdx]) return;
            
            const imgEl = document.getElementById(`img-display-${itemId}`);
            if (imgEl) imgEl.src = item.images[imgIdx];

            item.images.forEach((_, idx) => {
                const dot = document.getElementById(`dot-${itemId}-${idx}`);
                if (dot) {
                    dot.className = `w-2 h-2 rounded-full ${idx === imgIdx ? 'bg-amber-400' : 'bg-white/60 hover:bg-white'} transition-all`;
                }
            });
        }

        function handleMultipleImagesUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            window.currentUploadedImages = window.currentUploadedImages || [];
            let loadedCount = 0;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    window.currentUploadedImages.push(event.target.result);
                    loadedCount++;
                    if (loadedCount === files.length) renderPreviewGrid();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderPreviewGrid() {
            const grid = document.getElementById('images-preview-grid');
            grid.innerHTML = '';
            (window.currentUploadedImages || []).forEach((imgSrc, idx) => {
                const div = document.createElement('div');
                div.className = "relative h-24 rounded-2xl overflow-hidden border border-chai-300 bg-chai-100 group";
                div.innerHTML = `
                    <img src="${imgSrc}" class="h-full w-full object-cover" alt="預覽">
                    <button type="button" onclick="removeUploadedImage(${idx})" class="absolute top-1.5 right-1.5 h-6 w-6 bg-chai-dark/80 text-white rounded-full flex items-center justify-center text-xs hover:bg-rose-700 transition-all"><i class="fa-solid fa-xmark"></i></button>
                `;
                grid.appendChild(div);
            });
        }

        function removeUploadedImage(index) {
            window.currentUploadedImages.splice(index, 1);
            renderPreviewGrid();
        }

        function adjustQty(id, amount) {
            const inventory = window.getInventory ? window.getInventory() : [];
            const item = inventory.find(i => i.id === id);
            if (!item) return;
            const newQty = item.qty + amount;
            if (newQty < 0) {
                showToast('數量不能小於 0', 'error');
                return;
            }
            item.qty = newQty;
            if (window.saveItem) window.saveItem(item);
            renderInventory();
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('item-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('item-form');
            form.reset();
            window.currentUploadedImages = [];
            document.getElementById('images-preview-grid').innerHTML = '';

            if (mode === 'add') {
                title.innerText = '新增贈品項目';
                document.getElementById('item-id').value = '';
            } else if (mode === 'edit') {
                title.innerText = '編輯贈品項目';
                const inventory = window.getInventory ? window.getInventory() : [];
                const item = inventory.find(i => i.id === id);
                if (item) {
                    document.getElementById('item-id').value = item.id;
                    document.getElementById('form-name').value = item.name;
                    document.getElementById('form-qty').value = item.qty;
                    if (item.images && item.images.length > 0) {
                        window.currentUploadedImages = [...item.images];
                        renderPreviewGrid();
                    }
                }
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const name = document.getElementById('form-name').value;
            const qty = parseInt(document.getElementById('form-qty').value);
            const images = window.currentUploadedImages || [];
            const finalImages = images.length > 0 ? images : ['https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&q=80&w=300'];

            if (id) {
                const inventory = window.getInventory ? window.getInventory() : [];
                const item = inventory.find(i => i.id === id);
                if (item) {
                    item.name = name;
                    item.qty = qty;
                    item.images = finalImages;
                    if (window.saveItem) window.saveItem(item);
                    showToast('贈品更新成功', 'success');
                }
            } else {
                const newItem = {
                    id: 'gift_' + Date.now(),
                    name,
                    qty,
                    images: finalImages
                };
                if (window.saveItem) window.saveItem(newItem);
                showToast('新增贈品成功', 'success');
            }

            closeModal();
            renderInventory();
        }

        function deleteItem(id) {
            const inventory = window.getInventory ? window.getInventory() : [];
            const item = inventory.find(i => i.id === id);
            if (!item) return;
            if (confirm(`確定要刪除 "${item.name}" 嗎？`)) {
                if (window.deleteItemCloud) window.deleteItemCloud(id);
                renderInventory();
                showToast('贈品已刪除', 'success');
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-chai-dark text-cream-50 border border-chai-700/60' : 'bg-rose-800 text-white';
            const icon = type === 'success' ? 'fa-circle-check text-amber-400' : 'fa-triangle-exclamation text-rose-200';
            toast.className = `flex items-center space-x-3.5 px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-semibold ${bgClass} animate-fade-in pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.onload = function() {
            if (window.initCloud) window.initCloud();
            else renderInventory();
        };
    </script>
</body>
</html>
